# MattBar OSD media keys for Omarchy 3.x
#
# Omarchy 3.x routes keys through swayosd (change + overlay). D-Bus
# activated, so killing does nothing. Unbind and use plain tools so
# MattBar's event-driven OSD reacts instead.
#
# Install: append to hyprland.conf after Omarchy defaults, or source
# this file. Reload: hyprctl reload

# --- volume ---------------------------------------------------------------
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = ALT, XF86AudioRaiseVolume
unbind = ALT, XF86AudioLowerVolume
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# --- microphone -----------------------------------------------------------
# Plain wpctl; MattBar mic OSD from PipeWire source event.
# (Use omarchy-audio-input-mute if you need the hardware LED; it summons swayosd.)
unbind = , XF86AudioMicMute
bindeld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- display brightness ---------------------------------------------------
# brightnessctl; MattBar backlight uevent watcher shows OSD.
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
unbind = SHIFT, XF86MonBrightnessUp
unbind = SHIFT, XF86MonBrightnessDown
unbind = ALT, XF86MonBrightnessUp
unbind = ALT, XF86MonBrightnessDown
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set +5%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, brightnessctl set 100%
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, brightnessctl set 1%
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, brightnessctl set +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, brightnessctl set 1%-

# --- media transport ------------------------------------------------------
# Plain playerctl; MattBar media module via MPRIS.
unbind = , XF86AudioNext
unbind = , XF86AudioPause
unbind = , XF86AudioPlay
unbind = , XF86AudioPrev
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# Keyboard-backlight (XF86KbdBrightness*) left to Omarchy (no MattBar OSD).
